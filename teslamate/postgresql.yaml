apiVersion: vshn.appcat.vshn.io/v1
kind: VSHNPostgreSQL
metadata:
  name: teslamate-db
spec:
  parameters:
    service:
      majorVersion: "17"
      serviceLevel: besteffort
    size:
      plan: standard-2
    # AppCat generates PersistentVolumeFillingUp / PersistentVolumeExpectedToFillUp
    # rules in the instance namespace. They only reach us if we hand it an
    # AlertmanagerConfig to copy over; without this, they fire into the void.
    monitoring:
      alertmanagerConfigRef: teslacontrol-alerts
      alertmanagerConfigSecretRef: telegram-bot
    security:
      allowedNamespaces:
        - arska-teslacontrol
    backup:
      enabled: true
      schedule: "0 2 * * *"
      retention: 6
  writeConnectionSecretToRef:
    name: teslamate-db-credentials
